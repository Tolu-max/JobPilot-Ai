<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
    }
    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #60a5fa;
    }
    p {
      font-size: 0.9rem;
      color: #94a3b8;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #3b82f6;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 10px;
      transition: background-color 0.2s;
    }
    button:hover {
      background-color: #2563eb;
    }
    textarea {
      width: 100%;
      height: 100px;
      background-color: #1e293b;
      color: #34d399;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 8px;
      font-family: monospace;
      font-size: 0.8rem;
      box-sizing: border-box;
      resize: none;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h2>JobPilot Cookie Extractor</h2>
  <p>Export your current session to JobPilot to skip bot checks.</p>
  
  <button id="extractBtn">Extract Active Cookies</button>
  
  <div id="resultContainer" class="hidden">
    <p>Success! Paste this in your profile's <code>cookies.json</code>:</p>
    <textarea id="cookieOutput" readonly></textarea>
    <button id="copyBtn" style="background-color: #10b981; margin-top: 10px;">Copy to Clipboard</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
