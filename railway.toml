# Railway deploy config - JobPilot private runner
# Docs: https://docs.railway.com/guides/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Default mode: review-first scheduler. The catch-up script can enable live
# submission for selected sources, so it must be invoked explicitly only after
# profiles and local approvals have been configured.
# Railway start commands replace the Docker ENTRYPOINT. Keep dumb-init and the
# volume bootstrap explicit so Chromium children are reaped and /app/data is
# linked before the scheduler starts.
startCommand = "./scripts/railway-entrypoint.sh node scripts/railway-worker.mjs"

restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Background worker only. Do not expose this private runner publicly.

# Persistent volume. The Docker entrypoint links profiles, logs, review queues,
# debug artifacts, browser profiles, and test results into /app/data.
[[volumes]]
mountPath = "/app/data"
name = "jobpilot-data"
