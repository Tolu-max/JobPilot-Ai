<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JobPilot Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .gradient-bg { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
    .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 9999px; font-size: 12px; font-weight: 600; }
    .status-applied { background: #dcfce7; color: #166534; }
    .status-reviewed { background: #fef3c7; color: #92400e; }
    .status-manual { background: #fef3c7; color: #92400e; }
    .status-pending { background: #dbeafe; color: #1e40af; }
    .status-failed { background: #fee2e2; color: #991b1b; }
    .status-ignored { background: #f3f4f6; color: #4b5563; }
    .profile-tab { transition: all 0.15s ease; cursor: pointer; }
    .profile-tab.active { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; box-shadow: 0 4px 12px rgba(102, 126, 234, 0.35); }
    .profile-tab.active .tab-count { background: rgba(255,255,255,0.25); color: white; }
    .profile-tab:not(.active):hover { background: #eef2ff; }
  </style>
</head>
<body class="bg-gray-50">

  <!-- Header -->
  <header class="bg-white shadow-sm border-b border-gray-200">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 gradient-bg rounded-lg flex items-center justify-center">
          <i data-lucide="bot" class="text-white w-6 h-6"></i>
        </div>
        <div>
          <h1 class="text-xl font-bold text-gray-900">JobPilot</h1>
          <p class="text-sm text-gray-500">Automated Job Hunter</p>
        </div>
      </div>
      <div class="flex items-center gap-4">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
          <span class="text-sm font-medium text-gray-700" id="status-text">Online</span>
        </div>
        <button onclick="loadAll()" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition flex items-center gap-2">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          Refresh
        </button>
      </div>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-6 py-8">

    <!-- Profile Tabs -->
    <div id="profile-tabs" class="flex flex-wrap gap-3 mb-6">
      <div class="text-sm text-gray-500 self-center">Loading profiles...</div>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-5 gap-6 mb-8">
      <div class="bg-white rounded-xl p-6 shadow-sm card-hover transition-all">
        <div class="flex items-center justify-between mb-4">
          <div class="w-12 h-12 bg-purple-100 rounded-lg flex items-center justify-center">
            <i data-lucide="briefcase" class="w-6 h-6 text-purple-600"></i>
          </div>
        </div>
        <div class="text-3xl font-bold text-gray-900" id="s-total">-</div>
        <div class="text-sm text-gray-500 mt-1">Total Jobs</div>
      </div>

      <div class="bg-white rounded-xl p-6 shadow-sm card-hover transition-all">
        <div class="flex items-center justify-between mb-4">
          <div class="w-12 h-12 bg-green-100 rounded-lg flex items-center justify-center">
            <i data-lucide="check-circle-2" class="w-6 h-6 text-green-600"></i>
          </div>
        </div>
        <div class="text-3xl font-bold text-gray-900" id="s-applied">-</div>
        <div class="text-sm text-gray-500 mt-1">Applied</div>
      </div>

      <div class="bg-white rounded-xl p-6 shadow-sm card-hover transition-all">
        <div class="flex items-center justify-between mb-4">
          <div class="w-12 h-12 bg-yellow-100 rounded-lg flex items-center justify-center">
            <i data-lucide="inbox" class="w-6 h-6 text-yellow-600"></i>
          </div>
        </div>
        <div class="text-3xl font-bold text-gray-900" id="s-reviewed">-</div>
        <div class="text-sm text-gray-500 mt-1">Needs Review</div>
      </div>

      <div class="bg-white rounded-xl p-6 shadow-sm card-hover transition-all">
        <div class="flex items-center justify-between mb-4">
          <div class="w-12 h-12 bg-blue-100 rounded-lg flex items-center justify-center">
            <i data-lucide="clock" class="w-6 h-6 text-blue-600"></i>
          </div>
        </div>
        <div class="text-3xl font-bold text-gray-900" id="s-pending">-</div>
        <div class="text-sm text-gray-500 mt-1">Queued</div>
      </div>

      <div class="bg-white rounded-xl p-6 shadow-sm card-hover transition-all">
        <div class="flex items-center justify-between mb-4">
          <div class="w-12 h-12 bg-red-100 rounded-lg flex items-center justify-center">
            <i data-lucide="x-circle" class="w-6 h-6 text-red-600"></i>
          </div>
        </div>
        <div class="text-3xl font-bold text-gray-900" id="s-failed">-</div>
        <div class="text-sm text-gray-500 mt-1">Failed</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-4">
          <span id="active-profile-label" class="text-sm font-medium text-gray-700">Showing: <span class="text-indigo-600 font-semibold">All Profiles</span></span>

          <label class="text-sm font-medium text-gray-700 ml-4">Status:</label>
          <select id="status-filter" onchange="filterChanged()" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
            <option value="">All Jobs</option>
            <option value="reviewed">Pending Review</option>
            <option value="manual_review">Manual Review</option>
            <option value="pending_apply">Queued to Apply</option>
            <option value="applied">Applied</option>
            <option value="failed">Failed</option>
            <option value="ignored">Ignored</option>
          </select>
        </div>

        <button onclick="approveAllVisible()" class="px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition flex items-center gap-2">
          <i data-lucide="check-square" class="w-4 h-4"></i>
          Approve All Visible
        </button>
      </div>
    </div>

    <!-- Jobs Table -->
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead class="bg-gray-50 border-b border-gray-200">
            <tr>
              <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Job Title</th>
              <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Platform</th>
              <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Score</th>
              <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Profile</th>
              <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Status</th>
              <th class="px-6 py-4 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Actions</th>
            </tr>
          </thead>
          <tbody id="job-list" class="divide-y divide-gray-200">
            <tr>
              <td colspan="6" class="px-6 py-12 text-center text-gray-500">
                <i data-lucide="loader-2" class="w-8 h-8 mx-auto mb-2 animate-spin"></i>
                <p>Loading jobs...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div id="pagination" class="px-6 py-4 bg-gray-50 border-t border-gray-200 flex items-center justify-between"></div>
    </div>

  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 right-6 bg-gray-900 text-white px-6 py-4 rounded-lg shadow-xl transform translate-y-32 opacity-0 transition-all duration-300 flex items-center gap-3">
    <i data-lucide="check-circle" class="w-5 h-5"></i>
    <span id="toast-msg"></span>
  </div>

  <script>
    lucide.createIcons();

    let currentProfile = null;
    let currentStatus = '';
    let currentPage = 1;
    let totalPages = 1;

    window.addEventListener('DOMContentLoaded', () => {
      loadAll();
      setInterval(loadAll, 30000);
    });

    async function loadAll() {
      await Promise.all([loadStats(), loadJobs()]);
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        if (!res.ok) throw new Error();
        const data = await res.json();

        renderProfileTabs(data.profiles || [], data.totals);
        applyFocusedStats(data);
      } catch {
        document.getElementById('status-text').textContent = 'Offline';
      }
    }

    function applyFocusedStats(data) {
      let focused;
      if (currentProfile) {
        focused = (data.profiles || []).find(p => p.profile === currentProfile);
      }
      const t = focused || data.totals;
      document.getElementById('s-total').textContent = t.total ?? 0;
      document.getElementById('s-applied').textContent = t.applied ?? 0;
      document.getElementById('s-reviewed').textContent = (t.reviewed ?? 0) + (t.manual_review ?? 0);
      document.getElementById('s-pending').textContent = t.pending_apply ?? 0;
      document.getElementById('s-failed').textContent = t.failed ?? 0;
    }

    function renderProfileTabs(profiles, totals) {
      const container = document.getElementById('profile-tabs');
      const reviewCount = (p) => (p.reviewed || 0) + (p.manual_review || 0) + (p.pending_apply || 0);
      const tab = (key, label, count, isActive) => `
        <button class="profile-tab ${isActive ? 'active' : 'bg-white text-gray-700'} px-5 py-3 rounded-xl shadow-sm flex items-center gap-3 border border-gray-200"
                data-profile="${esc(key)}" onclick="switchProfile('${esc(key)}')">
          <i data-lucide="${key === '' ? 'layers' : 'user'}" class="w-4 h-4"></i>
          <span class="font-semibold">${esc(label)}</span>
          <span class="tab-count text-xs px-2 py-0.5 rounded-full bg-gray-100 text-gray-600 font-medium">${count}</span>
        </button>`;

      const allActive = !currentProfile;
      const allReview = profiles.reduce((sum, p) => sum + reviewCount(p), 0);
      const html = [tab('', 'All Profiles', allReview, allActive)];
      for (const p of profiles) html.push(tab(p.profile, p.profile, reviewCount(p), currentProfile === p.profile));
      container.innerHTML = html.join('');
      lucide.createIcons();

      const labelEl = document.getElementById('active-profile-label');
      if (labelEl) {
        labelEl.innerHTML = `Showing: <span class="text-indigo-600 font-semibold">${currentProfile ? esc(currentProfile) : 'All Profiles'}</span>`;
      }
    }

    function switchProfile(profileKey) {
      currentProfile = profileKey || null;
      currentPage = 1;
      loadAll();
    }

    async function loadJobs() {
      const params = new URLSearchParams({ page: currentPage, limit: 50 });
      if (currentProfile) params.set('profile', currentProfile);
      if (currentStatus) params.set('status', currentStatus);

      try {
        const res = await fetch('/api/jobs?' + params);
        const data = await res.json();
        renderJobs(data.items || []);
        renderPagination(data.page, data.pages, data.total);
        lucide.createIcons();
      } catch {
        document.getElementById('job-list').innerHTML = '<tr><td colspan="6" class="px-6 py-12 text-center text-red-500">Failed to load jobs</td></tr>';
      }
    }

    function renderJobs(jobs) {
      const tbody = document.getElementById('job-list');
      if (jobs.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-12 text-center text-gray-500">No jobs found</td></tr>';
        return;
      }

      tbody.innerHTML = jobs.map(job => {
        const score = job.score || 0;
        const scoreColor = score >= 80 ? 'text-green-600' : score >= 60 ? 'text-yellow-600' : 'text-red-600';
        const canAction = ['reviewed', 'pending_apply', 'failed', 'manual_review'].includes(job.status);
        const url = job.job_url || job.applicationUrl || '';

        let statusClass = 'status-ignored';
        let statusLabel = 'Ignored';

        if (job.status === 'applied') { statusClass = 'status-applied'; statusLabel = 'Applied'; }
        else if (job.status === 'reviewed') { statusClass = 'status-reviewed'; statusLabel = 'Review'; }
        else if (job.status === 'manual_review') { statusClass = 'status-manual'; statusLabel = 'Manual Review'; }
        else if (job.status === 'pending_apply') { statusClass = 'status-pending'; statusLabel = 'Queued'; }
        else if (job.status === 'failed') { statusClass = 'status-failed'; statusLabel = 'Failed'; }

        return `
        <tr class="hover:bg-gray-50 transition" data-hash="${esc(job.job_hash)}" data-profile="${esc(job._profile)}">
          <td class="px-6 py-4">
            <div class="font-semibold text-gray-900">${esc(job.title)}</div>
            <div class="text-sm text-gray-500">${esc(job.company || 'Unknown')}</div>
          </td>
          <td class="px-6 py-4">
            <span class="px-3 py-1 bg-gray-100 text-gray-700 rounded-full text-xs font-medium">${esc(job.source_site)}</span>
          </td>
          <td class="px-6 py-4">
            <div class="flex items-center gap-2">
              <span class="font-bold ${scoreColor}">${score}</span>
              <div class="w-16 h-2 bg-gray-200 rounded-full overflow-hidden">
                <div class="h-full ${score >= 80 ? 'bg-green-500' : score >= 60 ? 'bg-yellow-500' : 'bg-red-500'}" style="width: ${score}%"></div>
              </div>
            </div>
          </td>
          <td class="px-6 py-4 text-sm font-medium text-gray-700">${esc(job._profile)}</td>
          <td class="px-6 py-4">
            <span class="status-badge ${statusClass}">${statusLabel}</span>
          </td>
          <td class="px-6 py-4">
            <div class="flex items-center gap-2">
              ${canAction ? `
                <button onclick="approve(this)" class="p-2 bg-green-100 text-green-600 rounded-lg hover:bg-green-200 transition" title="Approve">
                  <i data-lucide="check" class="w-4 h-4"></i>
                </button>
                <button onclick="reject(this)" class="p-2 bg-red-100 text-red-600 rounded-lg hover:bg-red-200 transition" title="Reject">
                  <i data-lucide="x" class="w-4 h-4"></i>
                </button>
              ` : ''}
              ${url ? `<a href="${url}" target="_blank" class="p-2 bg-gray-100 text-gray-600 rounded-lg hover:bg-gray-200 transition" title="View Job"><i data-lucide="external-link" class="w-4 h-4"></i></a>` : ''}
            </div>
          </td>
        </tr>`;
      }).join('');
      lucide.createIcons();
    }

    function renderPagination(page, pages, total) {
      const el = document.getElementById('pagination');
      if (pages <= 1) { el.innerHTML = ''; return; }
      el.innerHTML = `
        <div class="text-sm text-gray-600">Showing page ${page} of ${pages} (${total} total jobs)</div>
        <div class="flex gap-2">
          <button ${page <= 1 ? 'disabled' : ''} onclick="goPage(${page-1})" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition disabled:opacity-50 disabled:cursor-not-allowed">Previous</button>
          <button ${page >= pages ? 'disabled' : ''} onclick="goPage(${page+1})" class="px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition disabled:opacity-50 disabled:cursor-not-allowed">Next</button>
        </div>
      `;
    }

    async function approve(btn) {
      const row = btn.closest('tr');
      const hash = row?.dataset.hash || '';
      const profile = row?.dataset.profile || '';
      btn.disabled = true;
      try {
        const res = await fetch(`/api/approve/${encodeURIComponent(hash)}?profile=${encodeURIComponent(profile)}`, { method: 'POST' });
        const data = await res.json().catch(() => ({}));
        if (res.ok) { showToast('Job approved for application', 'ok'); loadJobs(); loadStats(); }
        else showToast(data.error || 'Failed to approve', 'err');
      } catch { showToast('Request failed', 'err'); }
    }

    async function reject(btn) {
      const row = btn.closest('tr');
      const hash = row?.dataset.hash || '';
      const profile = row?.dataset.profile || '';
      btn.disabled = true;
      try {
        const res = await fetch(`/api/cancel/${encodeURIComponent(hash)}?profile=${encodeURIComponent(profile)}`, { method: 'POST' });
        const data = await res.json().catch(() => ({}));
        if (res.ok) { showToast('Job rejected', 'ok'); loadJobs(); loadStats(); }
        else showToast(data.error || 'Failed to reject', 'err');
      } catch { showToast('Request failed', 'err'); }
    }

    async function approveAllVisible() {
      const rows = document.querySelectorAll('tr[data-hash]');
      const toApprove = Array.from(rows).filter(r => r.querySelector('button[onclick*="approve"]'));
      if (!toApprove.length) return showToast('No jobs to approve', 'err');
      if (!confirm(`Approve ${toApprove.length} job(s)?`)) return;

      for (const row of toApprove) {
        const hash = row.dataset.hash;
        const profile = row.dataset.profile || '';
        await fetch(`/api/approve/${encodeURIComponent(hash)}?profile=${encodeURIComponent(profile)}`, { method: 'POST' }).catch(()=>{});
      }
      showToast(`Approved ${toApprove.length} jobs`, 'ok');
      loadJobs(); loadStats();
    }

    function filterChanged() {
      currentStatus = document.getElementById('status-filter').value || '';
      currentPage = 1;
      loadJobs();
    }

    function goPage(page) { currentPage = page; loadJobs(); }

    function esc(str) {
      return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    let toastTimer;
    function showToast(msg, type = 'ok') {
      const t = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      t.className = 'fixed bottom-6 right-6 bg-gray-900 text-white px-6 py-4 rounded-lg shadow-xl flex items-center gap-3 transform translate-y-0 opacity-100 transition-all duration-300';
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        t.className = 'fixed bottom-6 right-6 bg-gray-900 text-white px-6 py-4 rounded-lg shadow-xl flex items-center gap-3 transform translate-y-32 opacity-0 transition-all duration-300';
      }, 3500);
      lucide.createIcons();
    }
  </script>
</body>
</html>
